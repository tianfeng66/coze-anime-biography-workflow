                    请根据以上内容生成一套完整的16:9横屏动漫人物传记视频分镜。

                    如果用户提供了life_story，必须以life_story作为主要事实来源，对内容进行整理、提炼和故事化表达，不得擅自改变关键经历。

                    如果life_story为空，才根据subject_input中的人物名称或人物设定生成内容。
            - name: enableChatHistory
