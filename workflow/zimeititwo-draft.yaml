          type: code
          title: 简体字幕数据
          icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
          description: "编写代码，处理输入变量来生成返回值"
          version: v2
          position:
            x: 125.14598420060874
            y: 357.5354597400336
          parameters:
            code: |-
                async function main({ params }) {
                  const text = String(params.text || "").trim();
                  const duration = Math.max(Number(params.duration) || 8, 1);

                  const parts =
                    text.match(/[^，。！？；]+[，。！？；]?/g)
                      ?.map(item => item.trim())
                      .filter(Boolean) || [text];

                  const start = 0.2;
                  const segmentDuration = (duration - 0.4) / parts.length;

                  const text_list = parts.map((item, index) => ({
                    text: item,
                    start_time: Number((start + index * segmentDuration).toFixed(2)),
                    end_time: Number((start + (index + 1) * segmentDuration).toFixed(2))
                  }));

                  return { text_list };
                }
            language: 5
            node_inputs:
                - name: text
                  input:
                    type: string
                    value:
                        path: scenes.narration
                        ref_node: "132307"
                - name: duration
                  input:
                    value:
                        path: data.duration
                        ref_node: "122274"
            node_outputs:
                text_list:
                    type: list
                    items:
                        type: object
                        properties:
                            end_time:
                                type: float
                                value: null
                            start_time:
                                type: float
                                value: null
                            text:
                                type: string
                                value: null
                        value: null
                    value: null
            settingOnError:
                processType: 1
                retryTimes: 0
                timeoutMs: 60000
